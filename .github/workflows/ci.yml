name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.x'
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest -q
      - name: Published export API document is in step with the routes
        run: uv run python scripts/export_openapi.py --check

  migrations:
    # The backend suite runs on SQLite; this catches migrations that only break
    # on Postgres (the production DB) — e.g. dialect-specific DDL literals.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tvtimes
          POSTGRES_PASSWORD: tvtimes
          POSTGRES_DB: tvtimes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tvtimes"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TVTIMES_DATABASE_URL: postgresql+asyncpg://tvtimes:tvtimes@localhost:5432/tvtimes
      TVTIMES_ENCRYPTION_KEY: ci-not-a-real-key
      TVTIMES_PUBLIC_ORIGIN: http://localhost
      TVTIMES_WEBAUTHN_RP_ID: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.x'
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - name: alembic upgrade head (Postgres)
        run: uv run alembic upgrade head
      - name: alembic downgrade base, then upgrade again
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

  connector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.x'
      - run: uv python install 3.12
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the all-in-one image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: tvtimes:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the entrypoint
        run: |
          docker run --rm --entrypoint sh tvtimes:ci -c \
            'python -c "import app.main" && alembic --version && arq --version'
