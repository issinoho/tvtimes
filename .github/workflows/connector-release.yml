name: Release connector

# Tag a connector release to publish the LAN agent:
#   git tag connector-v1.2.0 && git push origin connector-v1.2.0
#
# Publishes:
#   - issinoho/tvtimes-connector + ghcr.io/issinoho/tvtimes-connector (multi-arch)
#   - the built wheel + sdist, attached to the GitHub Release
#
# Requires repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.

on:
  push:
    tags: ['connector-v*']

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            issinoho/tvtimes-connector
            ghcr.io/issinoho/tvtimes-connector
          tags: |
            type=match,pattern=connector-v(.*),group=1
            type=match,pattern=connector-v(\d+\.\d+),group=1
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./connector
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: '0.10.x'
      - run: uv build --wheel --sdist
        working-directory: connector
      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: connector/dist/*
