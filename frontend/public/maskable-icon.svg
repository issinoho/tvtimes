<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Maskable variant of favicon.svg. Android crops maskable icons to the
       central 80% and applies its own circle/squircle mask, so the gradient
       runs edge to edge (the mask supplies the shape) and the glyph stays
       inside the safe zone: a circle of radius 25.6 about (32, 32). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B0A3D"/>
      <stop offset="0.45" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" fill="url(#g)"/>
  <rect x="14" y="31" width="36" height="2" rx="1" fill="#F4EEFF" fill-opacity="0.35"/>
  <path d="M27 22 L43 32 L27 42 Z" fill="#F4EEFF" fill-opacity="0.92"/>
</svg>
