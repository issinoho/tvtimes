<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">tvtimes</title>
  <desc id="d">A vintage listings-magazine style cover: the tvtimes name above a column of programme times, beside a retro television set showing a channel guide.</desc>
  <defs>
    <pattern id="halftone" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.1" fill="#1b1a17" opacity="0.10"/>
    </pattern>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1233"/>
      <stop offset="1" stop-color="#0B0713"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B0A3D"/>
      <stop offset="0.45" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <clipPath id="screenClip"><rect x="796" y="112" width="300" height="200" rx="26"/></clipPath>
  </defs>

  <!-- newsprint -->
  <rect width="1200" height="420" fill="#f2e8d2"/>
  <rect width="1200" height="420" fill="url(#halftone)"/>
  <rect x="10" y="10" width="1180" height="400" fill="none" stroke="#1b1a17" stroke-width="3"/>
  <rect x="18" y="18" width="1164" height="384" fill="none" stroke="#1b1a17" stroke-width="1"/>

  <!-- issue line -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1b1a17" letter-spacing="2">
    <text x="40" y="46">EVERY SOURCE · ONE GUIDE</text>
    <text x="600" y="46" text-anchor="middle" font-style="italic" letter-spacing="1">Home lab edition</text>
    <text x="1160" y="46" text-anchor="end">PRICE: FREE</text>
  </g>
  <line x1="40" y1="58" x2="1160" y2="58" stroke="#1b1a17" stroke-width="1.5"/>

  <!-- masthead -->
  <rect x="40" y="72" width="700" height="132" fill="url(#band)"/>
  <text x="64" y="178" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="112" fill="#f2e8d2" letter-spacing="-3">tvtimes</text>
  <rect x="40" y="212" width="700" height="6" fill="#1b1a17"/>
  <text x="40" y="246" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#1b1a17">A self-hosted TV guide, in one Docker Compose stack</text>

  <!-- listings -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1b1a17">
    <line x1="40" y1="266" x2="740" y2="266" stroke="#1b1a17" stroke-width="1"/>
    <g font-size="17">
      <text x="40" y="294" font-weight="bold">6.00</text><text x="92" y="294">Tonight</text>
      <text x="40" y="322" font-weight="bold">7.30</text><text x="92" y="322">The Weather Hour</text>
      <text x="40" y="350" font-weight="bold">8.00</text><text x="92" y="350">Gardens of Britain</text>
      <text x="40" y="378" font-weight="bold">9.00</text><text x="92" y="378">The Evening Film</text>
    </g>
    <line x1="290" y1="276" x2="290" y2="388" stroke="#1b1a17" stroke-width="1"/>
    <g font-size="15">
      <text x="308" y="292" font-weight="bold" letter-spacing="2" fill="#6D28D9">INSIDE</text>
      <text x="308" y="316">Playlists, Xtream, Stalker</text>
      <text x="308" y="338">HDHomeRun tuners</text>
      <text x="308" y="360">TMDB films and ratings</text>
      <text x="308" y="382">Passkeys-first accounts</text>
    </g>
    <line x1="520" y1="276" x2="520" y2="388" stroke="#1b1a17" stroke-width="1"/>
    <g font-size="15">
      <text x="538" y="292" font-weight="bold" letter-spacing="2" fill="#6D28D9">EXPORTS TO</text>
      <text x="538" y="316">tvdinner</text>
      <text x="538" y="338">radiotimes</text>
      <text x="538" y="360">Jellyfin and Plex</text>
      <text x="538" y="382">TiviMate</text>
    </g>
  </g>

  <!-- retro television -->
  <g>
    <!-- aerial -->
    <line x1="946" y1="76" x2="896" y2="22" stroke="#1b1a17" stroke-width="4" stroke-linecap="round"/>
    <line x1="946" y1="76" x2="1010" y2="26" stroke="#1b1a17" stroke-width="4" stroke-linecap="round"/>
    <circle cx="896" cy="22" r="5" fill="#1b1a17"/>
    <circle cx="1010" cy="26" r="5" fill="#1b1a17"/>
    <ellipse cx="946" cy="80" rx="26" ry="10" fill="#1b1a17"/>
    <!-- cabinet -->
    <rect x="776" y="84" width="380" height="252" rx="22" fill="#7a4a2a" stroke="#1b1a17" stroke-width="4"/>
    <rect x="786" y="94" width="360" height="232" rx="16" fill="none" stroke="#a8693d" stroke-width="2"/>
    <!-- legs -->
    <line x1="820" y1="336" x2="806" y2="380" stroke="#1b1a17" stroke-width="6" stroke-linecap="round"/>
    <line x1="1112" y1="336" x2="1126" y2="380" stroke="#1b1a17" stroke-width="6" stroke-linecap="round"/>
    <!-- screen with a small guide -->
    <rect x="796" y="112" width="300" height="200" rx="26" fill="url(#screen)" stroke="#1b1a17" stroke-width="4"/>
    <g clip-path="url(#screenClip)" font-family="Helvetica, Arial, sans-serif">
      <text x="818" y="142" font-size="13" fill="#F4EEFF" font-weight="bold">Guide</text>
      <text x="1076" y="142" font-size="12" fill="#A99FC4" text-anchor="end">20:00</text>
      <line x1="868" y1="150" x2="868" y2="300" stroke="#DB2777" stroke-width="2"/>
      <g>
        <rect x="816" y="156" width="36" height="28" rx="4" fill="#2C2140"/>
        <rect x="856" y="156" width="96" height="28" rx="4" fill="#DB2777"/>
        <rect x="956" y="156" width="124" height="28" rx="4" fill="#2C2140"/>
        <rect x="816" y="190" width="36" height="28" rx="4" fill="#2C2140"/>
        <rect x="856" y="190" width="150" height="28" rx="4" fill="#4C2A8A"/>
        <rect x="1010" y="190" width="70" height="28" rx="4" fill="#2C2140"/>
        <rect x="816" y="224" width="36" height="28" rx="4" fill="#2C2140"/>
        <rect x="856" y="224" width="60" height="28" rx="4" fill="#4C2A8A"/>
        <rect x="920" y="224" width="160" height="28" rx="4" fill="#2C2140"/>
        <rect x="816" y="258" width="36" height="28" rx="4" fill="#2C2140"/>
        <rect x="856" y="258" width="120" height="28" rx="4" fill="#4C2A8A"/>
        <rect x="980" y="258" width="100" height="28" rx="4" fill="#2C2140"/>
      </g>
      <g font-size="11" fill="#F4EEFF">
        <text x="834" y="174" text-anchor="middle">1</text>
        <text x="834" y="208" text-anchor="middle">2</text>
        <text x="834" y="242" text-anchor="middle">3</text>
        <text x="834" y="276" text-anchor="middle">4</text>
      </g>
      <!-- screen glare -->
      <path d="M806 124 Q 860 114 900 120 L 830 200 Q 808 170 806 124 Z" fill="#ffffff" opacity="0.06"/>
    </g>
    <!-- controls -->
    <circle cx="1124" cy="146" r="14" fill="#e3c99a" stroke="#1b1a17" stroke-width="3"/>
    <line x1="1124" y1="146" x2="1124" y2="134" stroke="#1b1a17" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1124" cy="194" r="14" fill="#e3c99a" stroke="#1b1a17" stroke-width="3"/>
    <line x1="1124" y1="194" x2="1134" y2="186" stroke="#1b1a17" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#1b1a17" stroke-width="2">
      <line x1="1110" y1="236" x2="1138" y2="236"/>
      <line x1="1110" y1="248" x2="1138" y2="248"/>
      <line x1="1110" y1="260" x2="1138" y2="260"/>
      <line x1="1110" y1="272" x2="1138" y2="272"/>
      <line x1="1110" y1="284" x2="1138" y2="284"/>
    </g>
  </g>
</svg>
