    <rect x="14" y="29" width="48" height="2.5" rx="1.25" fill="#F4EEFF" fill-opacity="0.35"/>
    <path d="M30 16 L54 30 L30 44 Z" fill="#F4EEFF" fill-opacity="0.92"/>
