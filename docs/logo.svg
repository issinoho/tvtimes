      <stop offset="0.45" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <radialGradient id="wash" cx="0.28" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#6D28D9" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#DB2777" stop-opacity="0.18"/>
