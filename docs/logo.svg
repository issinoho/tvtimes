  <text x="164" y="104" font-family="'Space Grotesk','Segoe UI',ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="58" font-weight="600" letter-spacing="-1" fill="#F4EEFF">tvtimes</text>
  <text x="166" y="138" font-family="'Segoe UI',ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="20" font-weight="400" letter-spacing="0.2" fill="#F4EEFF" fill-opacity="0.62">self-hosted TV schedule guide</text>
