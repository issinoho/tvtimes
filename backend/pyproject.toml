[project]
name = "tvtimes-backend"
version = "0.1.0"
description = "tvtimes API — multi-tenant TV schedule service"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "structlog>=24.4",
    "httpx>=0.28",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    # auth (phase 2)
    "webauthn>=2.2",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "pyjwt[crypto]>=2.10",
    "cryptography>=44",
    "slowapi>=0.1.9",
    # worker + redis (phases 3+)
    "arq>=0.26",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "asgi-lifespan>=2.1",
    "soft-webauthn>=0.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]
"alembic/versions/*" = ["E501", "F401", "RUF100"]  # generated
"tests/*" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["webauthn.*", "arq.*", "soft_webauthn.*", "slowapi.*"]
ignore_missing_imports = true
